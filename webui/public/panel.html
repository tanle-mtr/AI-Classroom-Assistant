<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>AI 课堂助手 · 面板</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:"Microsoft YaHei","PingFang SC",sans-serif; }
  html,body { background:transparent; }
  body { padding:14px; color:#eaf0ff; user-select:none; }
  .panel { background:linear-gradient(160deg,#16223f 0%,#1e2c52 100%); border-radius:18px; padding:20px; box-shadow:0 12px 32px rgba(10,18,40,.45); height:100%; }
  .head { display:flex; align-items:center; gap:10px; margin-bottom:18px; }
  .logo { width:34px; height:34px; border-radius:9px; }
  .head h1 { font-size:16px; font-weight:700; letter-spacing:.5px; }
  .head .tag { margin-left:auto; font-size:11px; padding:3px 10px; border-radius:20px; background:rgba(47,107,255,.25); color:#9db8ff; }
  .course-card { background:linear-gradient(135deg,#2f6bff,#4f8bff); border-radius:16px; padding:18px; margin-bottom:14px; }
  .course-card .label { font-size:12px; opacity:.85; }
  .course-card .name { font-size:24px; font-weight:800; margin:6px 0 4px; }
  .course-card .meta { font-size:12px; opacity:.9; }
  .course-card .time { font-size:12px; opacity:.8; margin-top:6px; }
  .rows { display:flex; flex-direction:column; gap:10px; }
  .row { display:flex; align-items:center; gap:10px; background:rgba(255,255,255,.06); border-radius:12px; padding:12px 14px; font-size:13px; }
  .row .ic { width:26px; height:26px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:14px; background:rgba(47,107,255,.25); }
  .row .txt { flex:1; }
  .row .val { color:#9db8ff; font-size:12px; }
  .row .ok { color:#3ddc84; } .row .off { color:#8a94ad; }
  .actions { display:flex; gap:10px; margin-top:14px; }
  .btn { flex:1; text-align:center; padding:10px 0; border-radius:12px; background:rgba(255,255,255,.08); font-size:13px; cursor:pointer; transition:.2s; }
  .btn:hover { background:rgba(47,107,255,.45); }
  .foot { margin-top:14px; font-size:11px; color:#6b7ba0; text-align:center; }
</style>
</head>
<body>
<div class="panel" id="app">
  <div class="head">
    <img class="logo" src="/app.png" alt="logo" />
    <h1>AI 课堂助手</h1>
    <span class="tag" id="phase">待机</span>
  </div>
  <div class="course-card">
    <div class="label">当前课程</div>
    <div class="name" id="courseName">—</div>
    <div class="meta" id="courseMeta">等待 ClassIsland 课程事件</div>
    <div class="time" id="courseTime"></div>
  </div>
  <div class="rows">
    <div class="row"><span class="ic">🤖</span><span class="txt">Ollama 模型</span><span class="val" id="model">—</span></div>
    <div class="row"><span class="ic">🎥</span><span class="txt">监控</span><span class="val" id="mon">—</span></div>
    <div class="row"><span class="ic">🌐</span><span class="txt">公网 IP</span><span class="val" id="ip">—</span></div>
  </div>
  <div class="actions">
    <div class="btn" onclick="location.href='/'">总结文件</div>
    <div class="btn" onclick="location.href='/'">设置</div>
    <div class="btn" onclick="location.href='/'">完整控制台</div>
  </div>
  <div class="foot">由 ClassIsland 课程事件驱动 · Ollama 本地模型</div>
</div>
<script>
  async function refresh() {
    try {
      const s = await (await fetch('/api/state')).json();
      const phases = { idle: '待机', in_lesson: '上课中', processing: '生成中' };
      document.getElementById('phase').textContent = phases[s.phase] || s.phase;
      document.getElementById('courseName').textContent = s.current?.name || '—';
      document.getElementById('courseMeta').textContent = s.current
        ? `${s.current.subject} · ${s.current.lesson_type}`
        : '等待 ClassIsland 课程事件';
      document.getElementById('courseTime').textContent = s.current
        ? `已开始 ${s.current.started_at} · 已上 ${s.current.elapsed_min} 分钟` : '';
      document.getElementById('model').textContent = s.server?.ollama_model || '未选择';
      document.getElementById('mon').textContent = s.server?.monitoring ? '运行中' : '关闭';
      document.getElementById('ip').textContent = s.server?.public_ip || '获取中';
    } catch (e) { /* 核心未就绪 */ }
  }
  refresh();
  setInterval(refresh, 3000);
</script>
</body>
</html>
